<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gracias · Pitcheamos para empresas</title>
<meta name="description" content="Entrenamiento para equipos de ventas, procesos de selección de vendedores y outplacement. Con la mirada de alguien que vende y contrata todos los días.">
<meta property="og:title" content="Pitcheamos para empresas">
<meta property="og:description" content="Equipos que venden mejor. Procesos que contratan mejor.">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#F7F4EF;--navy:#14213D;--coral:#EF6450;--muted:#5B6474;--line:#E4DED4;--card:#FFFFFF;--soft:#C9CFDB}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--navy);font-family:'Inter',system-ui,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:inherit}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}
.wrap>*{min-width:0}
.hl{color:var(--coral)}
.eyebrow{display:inline-block;font-weight:700;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--coral);margin-bottom:14px}
h1{font-size:clamp(40px,5.6vw,68px);line-height:1.03;letter-spacing:-.035em;font-weight:900}
h2{font-size:clamp(30px,4vw,46px);line-height:1.08;letter-spacing:-.03em;font-weight:900;max-width:760px}
h3{font-weight:800;letter-spacing:-.01em}
.btn{display:inline-block;background:var(--coral);color:#fff;text-decoration:none;font-weight:700;padding:15px 26px;border-radius:999px;border:0;font-size:16px;cursor:pointer;transition:transform .15s;font-family:inherit}
.btn:hover{transform:translateY(-1px)}
.btn.ghost{background:transparent;border:2px solid currentColor;padding:13px 24px}
section{padding:80px 0}
section[id]{scroll-margin-top:72px}
.alt{background:var(--card);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:28px}
.card p,.card li{color:var(--muted)}
.grid{display:grid;gap:20px;margin-top:40px}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
/* nav */
nav{position:sticky;top:0;z-index:10;background:rgba(247,244,239,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;align-items:center;justify-content:space-between;height:68px;gap:20px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:900;letter-spacing:.06em;font-size:17px}
.logo svg{width:34px;height:34px}
.tag{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#fff;background:var(--navy);border-radius:999px;padding:4px 10px}
.links{display:flex;gap:28px;align-items:center;margin:0 auto}
.links a{text-decoration:none;font-size:15px;font-weight:500;color:var(--muted)}
.links a:hover{color:var(--navy)}
.links .btn-m{display:none}
.navend{display:flex;align-items:center;gap:14px}
.navend .btn{padding:11px 20px;font-size:14px}
.burger{display:none;background:none;border:0;width:42px;height:42px;cursor:pointer;padding:9px;border-radius:10px}
.burger span{display:block;height:2px;background:var(--navy);border-radius:2px;margin:5px 0;transition:.2s}
nav.open .burger span:nth-child(1){transform:translateY(7px) rotate(45deg)}
nav.open .burger span:nth-child(2){opacity:0}
nav.open .burger span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
/* hero */
.hero{background:var(--navy);color:#fff;padding:96px 0 88px}
.hero .wrap{display:grid;grid-template-columns:1.2fr 1fr;gap:56px;align-items:center}
.hero .lead{font-size:19px;color:var(--soft);margin:22px 0 30px;max-width:540px}
.ctas{display:flex;gap:12px;flex-wrap:wrap}
.hero .ghost{color:#fff}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.stat{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:22px;padding:26px}
.stat strong{display:block;font-size:44px;font-weight:900;letter-spacing:-.03em;color:var(--coral);line-height:1}
.stat strong.sm{font-size:26px;line-height:1.15}
.stat span{display:block;font-size:15px;color:var(--soft);margin-top:8px}
/* services */
.svc{background:var(--bg);display:flex;flex-direction:column;gap:12px}
.svc.featured{border:2px solid var(--coral)}
.ico{width:44px;height:44px;border-radius:12px;background:var(--coral);display:flex;align-items:center;justify-content:center}
.svc h3{font-size:22px}
.svc ul{padding-left:18px;display:flex;flex-direction:column;gap:6px}
.num{width:40px;height:40px;border-radius:12px;background:var(--navy);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;margin-bottom:16px}
.steps{list-style:none}
.steps h3{font-size:19px;margin-bottom:8px}
.fmt{display:flex;flex-direction:column;gap:10px}
.fmt.featured{border:2px solid var(--coral)}
.fmt .kicker{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--coral)}
.fmt h3{font-size:22px}
.fmt .price{margin-top:auto;padding-top:8px;font-weight:700;color:var(--navy)}
.center{text-align:center;color:var(--muted);margin-top:24px}
/* about */
.about .wrap{display:flex;gap:48px;align-items:center;flex-wrap:wrap}
.about img{width:220px;height:220px;border-radius:50%;object-fit:cover;border:6px solid var(--coral);flex:none}
.about .txt{flex:999 1 480px;min-width:0}
.about h2{font-size:clamp(28px,3.6vw,40px)}
.about p{color:var(--muted);font-size:17px;margin-top:14px;max-width:680px}
/* contact */
.contact{background:var(--navy);color:#fff}
.contact .wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:56px;align-items:start}
.contact .sub{color:var(--soft);font-size:18px;margin:16px 0 28px}
.contact .mail{display:block;margin-top:16px;color:#fff}
form{background:var(--card);color:var(--navy);border-radius:28px;padding:34px;display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
label{font-weight:600;font-size:15px;display:grid;gap:6px}
label .opt{font-weight:400;color:var(--muted)}
input,select,textarea{width:100%;min-width:0;font:inherit;color:var(--navy);padding:13px 15px;border:1.5px solid var(--line);border-radius:12px;background:#FDFCFA}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--coral)}
textarea{min-height:110px;resize:vertical}
.hidden{display:none}
.small{font-size:13px;color:var(--muted)}
.small a{color:var(--muted)}
footer{border-top:1px solid var(--line);padding:32px 0;color:var(--muted);font-size:14px}
footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
@media (max-width:1000px){
  .burger{display:block}
  .navend .btn{display:none}
  .links{display:none;position:absolute;top:68px;left:0;right:0;flex-direction:column;align-items:stretch;gap:0;margin:0;background:var(--bg);border-bottom:1px solid var(--line);padding:6px 24px 20px;box-shadow:0 12px 24px rgba(20,33,61,.08)}
  .links a{padding:14px 0;border-bottom:1px solid var(--line);font-size:17px;color:var(--navy)}
  .links .btn-m{display:block;margin-top:16px;text-align:center;border:0;color:#fff}
  nav.open .links{display:flex}
  .hero .wrap,.contact .wrap{grid-template-columns:1fr}
  .g3{grid-template-columns:1fr}
  .g4{grid-template-columns:1fr 1fr}
  .hero{padding:56px 0 48px} section{padding:60px 0}
}
@media (max-width:560px){.g4,.row2{grid-template-columns:1fr} .stat strong{font-size:36px} form{padding:24px} .tag{display:none}}
</style>
</head>

<nav><div class="wrap"><a class="logo" href="/"><svg viewBox="0 0 100 100" aria-hidden="true"><use href="#mark"/></svg>PITCHEAMOS <span class="tag">Empresas</span></a></div></nav>
<section><div class="wrap" style="max-width:720px;text-align:center">
  <span class="eyebrow">¡Gracias!</span>
  <h1 style="font-size:clamp(36px,5vw,56px)">Recibí tus datos. <span class="hl">Te escribo en menos de 48 horas.</span></h1>
  <p style="color:var(--muted);font-size:18px;margin:22px auto 30px;max-width:560px">Si preferís no esperar, reservá directo una reunión de 30 minutos en mi agenda.</p>
  <div class="ctas" style="justify-content:center"><a class="btn" href="https://meetings.hubspot.com/matias-bossie" target="_blank" rel="noopener">📅 Agendá una reunión</a><a class="btn ghost" href="/" style="color:var(--navy)">Volver al inicio</a></div>
</div></section>
</body>
</html>
